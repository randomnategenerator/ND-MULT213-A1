<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- link to the Bootstrap stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <title>Spotify Searcher</title>
</head>

<!-- Bootstrap classes for padding, alignment, margins, and inline display applied to the page -->
<body class="p-3">
    <main class="text-center">
        <h1 class="m-5">Explore Spotify!</h1>
        <!-- IDs for selecting the elements in the JavaScript code -->
        <input type="search" id="userSearch" name="q" class="d-inline">
        <button type="button" id="enterButton">Enter</button>
        <select name="options" id="typeOfSearch">
            <!-- these options decide which branch the code runs in -->
            <option value="artist">Artist</option>
            <option value="album">Album</option>
            <option value="track">Track</option>
        </select>
        <!-- the section for all of the user-searched information to be appended and cleared upon new searches -->
        <article id="searchSection" class="m-3 p-3">

        </article>


        <!-- scripts for my API code and the Spotify embedded iframe, used AI to help with importing the keys -->
        <script type='module' src="scripts.js"></script>
        <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    </main>
</body>

</html>
